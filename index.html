<!DOCTYPE html>
<html>
<head>
  <title>18th Birthday Invite</title>

  <!-- 🌸 Elegant font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: black;
      overflow-x: hidden;
      font-family: sans-serif;
      color: white;
    }

    img {
      width: 100%;
      display: block;
    }

    /* =========================
       🎵 MUSIC SCREEN (LUXURY)
       ========================= */
    #musicScreen {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(135deg, #bcdffb, #a7d8ff, #d6ecff);
      position: relative;
      overflow: hidden;
      font-family: 'Playfair Display', serif;
    }

    #musicScreen::before {
      content: "";
      position: absolute;
      inset: 0;
      backdrop-filter: blur(18px);
      background: rgba(255,255,255,0.08);
    }

    /* 💎 CARD */
    .music-card {
      position: relative;
      z-index: 2;
      padding: 50px 40px;
      border-radius: 28px;

      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(25px);

      box-shadow:
        0 20px 60px rgba(0,0,0,0.15),
        inset 0 0 20px rgba(255,255,255,0.3);

      text-align: center;
    }

    .music-card h2 {
      font-size: 30px;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }

    /* 🔘 BUTTONS */
    .yes-btn, .no-btn {
      display: block;
      width: 260px;
      margin: 12px auto;

      padding: 16px 22px;
      border-radius: 16px;
      border: none;

      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.3s ease;

      font-family: 'Playfair Display', serif;
    }

    .yes-btn {
      background: #a7d8ff;
      color: #1b3b5f;
      box-shadow: 0 0 25px rgba(167,216,255,0.6);
    }

    .yes-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(167,216,255,0.9);
    }

    .no-btn {
      background: rgba(255,255,255,0.35);
      color: white;
      border: 1px solid rgba(255,255,255,0.5);
    }

    .no-btn:hover {
      transform: scale(1.05);
      background: rgba(255,255,255,0.5);
    }

    /* =========================
       🌊 BUBBLES (GLOBAL)
       ========================= */
    .bubble {
      position: fixed;
      bottom: -120px;
      border-radius: 50%;

      background: radial-gradient(circle at 30% 30%,
        rgba(255,255,255,0.95),
        rgba(173,216,230,0.25),
        rgba(255,255,255,0.05)
      );

      box-shadow:
        inset 0 0 18px rgba(255,255,255,0.9),
        0 0 25px rgba(173,216,230,0.4);

      opacity: 0;
      animation: rise linear infinite;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 0;
      }
      15% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-1200px) translateX(80px) scale(1.3);
        opacity: 0;
      }
    }

    /* =========================
       ⏳ COUNTDOWN (GLASS CARD)
       ========================= */
    .countdown {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);

      display: flex;
      gap: 22px;

      padding: 16px 26px;
      border-radius: 26px;

      background: rgba(167, 216, 255, 0.22);
      backdrop-filter: blur(22px);

      border: 1px solid rgba(255, 255, 255, 0.35);

      box-shadow:
        0 10px 40px rgba(0, 40, 80, 0.15),
        inset 0 0 18px rgba(255, 255, 255, 0.25);

      z-index: 999;
      font-family: 'Playfair Display', serif;

      animation: floatGlow 6s ease-in-out infinite;
    }

    @keyframes floatGlow {
      0%, 100% {
        transform: translateX(-50%) translateY(0px);
      }
      50% {
        transform: translateX(-50%) translateY(4px);
      }
    }

    .box {
      text-align: center;
      min-width: 55px;
    }

    .box div {
      font-size: 28px;
      font-weight: 300;
      text-shadow:
        0 0 10px rgba(173, 216, 230, 0.6),
        0 0 20px rgba(167, 216, 255, 0.4);
    }

    .box small {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    #content {
      display: none;
      padding-top: 80px;
      position: relative;
      z-index: 1;
    }

  </style>
</head>

<body>

<!-- 🎵 MUSIC SCREEN -->
<div id="musicScreen">
  <div class="music-card">
    <h2>Play background music?</h2>
    <button class="yes-btn" onclick="start(true)">Yes, play music</button>
    <button class="no-btn" onclick="start(false)">No, thanks</button>
  </div>
</div>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- 📸 CONTENT -->
<div id="content">

  <!-- ⏳ COUNTDOWN -->
  <div class="countdown">
    <div class="box"><div id="days">0</div><small>Days</small></div>
    <div class="box"><div id="hours">0</div><small>Hours</small></div>
    <div class="box"><div id="minutes">0</div><small>Min</small></div>
    <div class="box"><div id="seconds">0</div><small>Sec</small></div>
  </div>

  <!-- 🖼 SLIDES -->
  <img src="slide1.jpg">
  <img src="slide2.jpg">
  <img src="slide3.jpg">
  <img src="slide4.jpg">
  <img src="slide5.jpg">
  <img src="slide6.jpg">

</div>

<script>

function start(playMusic) {
  document.getElementById("musicScreen").style.display = "none";
  document.getElementById("content").style.display = "block";

  if (playMusic) {
    let audio = document.getElementById("music");
    audio.volume = 0.6;
    audio.play().catch(()=>{});
  }
}

// ⏳ COUNTDOWN
var eventDate = new Date("June 17, 2026 19:00:00").getTime();

setInterval(function () {
  var now = new Date().getTime();
  var distance = eventDate - now;

  document.getElementById("days").innerHTML =
    Math.floor(distance / (1000 * 60 * 60 * 24));

  document.getElementById("hours").innerHTML =
    Math.floor((distance % (1000*60*60*24)) / (1000*60*60));

  document.getElementById("minutes").innerHTML =
    Math.floor((distance % (1000*60*60)) / (1000*60));

  document.getElementById("seconds").innerHTML =
    Math.floor((distance % (1000*60)) / 1000);
}, 1000);

// 🌊 GLOBAL BUBBLES
for (let i = 0; i < 60; i++) {
  let bubble = document.createElement("div");
  bubble.className = "bubble";

  let size = 10 + Math.random() * 40;

  bubble.style.width = size + "px";
  bubble.style.height = size + "px";
  bubble.style.left = Math.random() * 100 + "vw";
  bubble.style.animationDuration = (5 + Math.random() * 10) + "s";
  bubble.style.animationDelay = Math.random() * 6 + "s";

  document.body.appendChild(bubble);
}

</script>

</body>
</html>
