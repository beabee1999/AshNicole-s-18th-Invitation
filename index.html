<!DOCTYPE html>
<html>
<head>
  <title>18th Birthday Invite</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: black;
      overflow-x: hidden;
      font-family: sans-serif;
      color: white;
    }

    img {
      width: 100%;
      display: block;
    }

    /* =========================
       🌊 GLOBAL BUBBLES
       ========================= */
    .bubble {
      position: fixed;
      bottom: -150px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;

      background: radial-gradient(circle at 30% 30%,
        rgba(255,255,255,1),
        rgba(173,216,230,0.35),
        rgba(255,255,255,0.05)
      );

      box-shadow:
        inset 0 0 25px rgba(255,255,255,0.9),
        inset -10px -10px 30px rgba(173,216,230,0.3),
        0 0 35px rgba(173,216,230,0.7),
        0 0 60px rgba(255,255,255,0.4);

      opacity: 0;
      filter: blur(0.3px);

      animation: rise linear infinite;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(0.7);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(-1400px) translateX(120px) scale(1.5);
        opacity: 0;
      }
    }

    /* =========================
       🎵 MUSIC SCREEN
       ========================= */
    #musicScreen {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(135deg, #cfe9ff, #a7d8ff, #e3f4ff);
      position: relative;
      overflow: hidden;

      font-family: 'Playfair Display', serif;
      z-index: 1;
    }

    #musicScreen::before {
      content: "";
      position: absolute;
      inset: 0;
      backdrop-filter: blur(25px);
      background: rgba(255,255,255,0.15);
    }

    .music-card {
      position: relative;
      z-index: 2;

      width: 85%;
      max-width: 360px;

      padding: 40px 25px;
      border-radius: 28px;

      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(30px);

      box-shadow:
        0 20px 60px rgba(0, 60, 120, 0.2),
        inset 0 0 25px rgba(255,255,255,0.6);

      text-align: center;
    }

    .music-card h2 {
      font-size: 26px;
      font-weight: 300;
      line-height: 1.4;
      color: #2a4f6e;
      margin-bottom: 30px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      margin: 12px 0;

      border-radius: 14px;
      border: none;

      font-size: 18px;
      font-weight: 500;

      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn.primary {
      background: linear-gradient(135deg, #7fc8ff, #a7d8ff);
      color: #0f3554;

      box-shadow:
        0 10px 25px rgba(0, 120, 200, 0.25),
        inset 0 0 10px rgba(255,255,255,0.5);
    }

    .btn.primary:hover {
      transform: scale(1.05);
    }

    .btn.secondary {
      background: rgba(255,255,255,0.6);
      color: #2a4f6e;
      border: 1px solid rgba(255,255,255,0.7);
    }

    .btn.secondary:hover {
      transform: scale(1.05);
      background: rgba(255,255,255,0.85);
    }

    /* =========================
       ⏳ COUNTDOWN
       ========================= */
    .countdown {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px 24px;

      padding: 20px 30px;
      border-radius: 28px;

      background: rgba(167, 216, 255, 0.25);
      backdrop-filter: blur(22px);

      border: 1px solid rgba(255,255,255,0.4);

      box-shadow:
        0 12px 45px rgba(0, 60, 120, 0.2),
        inset 0 0 20px rgba(255,255,255,0.3);

      z-index: 5;

      font-family: 'Playfair Display', serif;
    }

    .box {
      text-align: center;
    }

    .box div {
      font-size: 34px;
      font-weight: 300;

      text-shadow:
        0 0 12px rgba(173,216,230,0.7),
        0 0 25px rgba(167,216,255,0.5);
    }

    .box small {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    #content {
      display: none;
      padding-top: 110px;
      position: relative;
      z-index: 2;
    }

  </style>
</head>

<body>

<!-- 🎵 MUSIC SCREEN -->
<div id="musicScreen">
  <div class="music-card">
    <h2>Would you like to play<br>background music?</h2>

    <button class="btn primary" onclick="start(true)">
      Yes, play music
    </button>

    <button class="btn secondary" onclick="start(false)">
      No, thanks
    </button>
  </div>
</div>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- 📸 CONTENT -->
<div id="content">

  <!-- ⏳ COUNTDOWN -->
  <div class="countdown">
    <div class="box"><div id="days">0</div><small>Days</small></div>
    <div class="box"><div id="hours">0</div><small>Hours</small></div>
    <div class="box"><div id="minutes">0</div><small>Min</small></div>
    <div class="box"><div id="seconds">0</div><small>Sec</small></div>
  </div>

  <!-- 🖼 SLIDES -->
  <img src="slide1.jpg">
  <img src="slide2.jpg">
  <img src="slide3.jpg">
  <img src="slide4.jpg">
  <img src="slide5.jpg">
  <img src="slide6.jpg">

</div>

<script>

// 🎵 START
function start(playMusic) {
  document.getElementById("musicScreen").style.display = "none";
  document.getElementById("content").style.display = "block";

  if (playMusic) {
    let audio = document.getElementById("music");
    audio.volume = 0.6;
    audio.play().catch(()=>{});
  }
}

// ⏳ COUNTDOWN
var eventDate = new Date("June 17, 2026 19:00:00").getTime();

setInterval(function () {
  var now = new Date().getTime();
  var distance = eventDate - now;

  document.getElementById("days").innerHTML =
    Math.floor(distance / (1000 * 60 * 60 * 24));

  document.getElementById("hours").innerHTML =
    Math.floor((distance % (1000*60*60*24)) / (1000*60*60));

  document.getElementById("minutes").innerHTML =
    Math.floor((distance % (1000*60*60)) / (1000*60));

  document.getElementById("seconds").innerHTML =
    Math.floor((distance % (1000*60)) / 1000);
}, 1000);

// 🌊 GLOBAL BUBBLES (EVERYWHERE)
for (let i = 0; i < 70; i++) {
  let bubble = document.createElement("div");
  bubble.className = "bubble";

  let size = 25 + Math.random() * 120;

  bubble.style.width = size + "px";
  bubble.style.height = size + "px";

  bubble.style.left = Math.random() * 100 + "vw";

  bubble.style.animationDuration = (6 + Math.random() * 12) + "s";
  bubble.style.animationDelay = Math.random() * 8 + "s";

  document.body.appendChild(bubble);
}

</script>

</body>
</html>
